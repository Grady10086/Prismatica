name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run pytest -q
      - run: uv run python skills/scientific-figure-making/examples/cs_paper_data_gallery.py --out /tmp/paper-data
      - run: uv run python skills/scientific-figure-making/examples/showcase_gallery.py --out /tmp/showcase
      - run: uv run python skills/scientific-figure-making/examples/advanced_showcase.py --out /tmp/advanced
      - run: uv run python scripts/build_gallery_cover.py --gallery /tmp/advanced --out /tmp/cover
      - run: uv run python skills/scientific-figure-making/examples/cs_showcase.py --out /tmp/cs-showcase
      - run: uv run python scripts/build_homepage.py --out /tmp/homepage
      - run: uv run python skills/scientific-figure-making/examples/cs_dense_gallery.py --inputs /tmp/cs-showcase/cs-inputs.npz --out /tmp/editorial
      - run: uv run python skills/scientific-figure-making/examples/multimodal_diffusion_plate.py --out /tmp/multimodal-diffusion
