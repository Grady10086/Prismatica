[project]
name = "prismatica"
version = "0.2.0"
description = "Unified scientific visualization skills and reproducible figure galleries"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.6", "numpy>=1.24"]

[project.optional-dependencies]
science = ["scipy>=1.10", "scikit-learn>=1.3", "scikit-image>=0.22"]
references = ["pymupdf>=1.24", "resvg-py>=0.2"]
dev = ["pytest>=8", "pypdf>=4", "pyyaml>=6", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/scientific-figure-making/tests", "skills/paper-colors/tests"]
